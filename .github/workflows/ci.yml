name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global pnpm@10.34.7
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --audit-level=moderate
      - run: CONFIG_PATH=config/config.example.yaml pnpm validate-config
      - run: docker build -t job-watcher-ci .
      - run: SMOKE_IMAGE=job-watcher-ci python3 tests/deployment/container-smoke.py
      - run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.0 git /repo --redact --no-banner
